# SleepPACNet-style fusion control (AGENT.md 13.43-G, "most important missing
# baseline"). Identical ingredients to `measured` -- the same a_j and the same
# gauge-invariant aligned_phase_j -- but combined by a learned Linear(3K->D)
# projection instead of the forced elementwise product. This is the free path
# §13.18 warns about: the projection COULD learn to ignore phase and pass
# amplitude through; the product arm structurally cannot.
# Adds ~25K params vs `measured` (the concat_proj), documented not hidden:
# a `measured` win is conservative (wins with LESS capacity); a concat win
# would need this margin controlled before being taken at face value.
# `mixer` is unused by arch=triaxial (v1-only, models/build.py:60) but train.py:83
# dereferences it eagerly inside a .get() default -> KeyError without it.
mixer: attention
arch: triaxial
freq_mixer: attention
tokenizer_mode: pac_interaction
pac_token_mode: measured
interaction_mode: concat
spatial_pe: xyz
band_pe: index
dataset: tuev
data_root: /scratch/zz5070/PACLock/tuh_eeg/v2.0.1/edf
n_channels: 16
seq_len: 1000
sample_rate: 200
sampling_rate: 200
num_classes: 6
n_bands: 8
d_model: 128
depth: 6
dropout: 0.2
kernel_size: 201
patch_len: 200
n_heads: 4
batch_size: 32
num_workers: 8
seed: 0
device: cuda
epochs: 20
eval_every: 1
patience: 20
lr: 0.0001
weight_decay: 0.00001
augmentations: []
wandb_run_name: pacint-tuev-concat
