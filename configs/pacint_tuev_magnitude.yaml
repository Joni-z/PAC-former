# Deterministic phase-destruction control (AGENT.md 13.43-G6).
# Keeps the measured PAC magnitude weighting, drops preferred-phase alignment.
# Unlike `scramble` it injects NO per-forward randomness, so
#   measured - magnitude  isolates preferred phase cleanly,
# whereas measured - scramble (+0.0394) is confounded by scramble's
# injected permutation noise (val std 0.0466 vs measured 0.0382).
# Ladder: uniform (neither) < magnitude (strength only) < measured (both).
# Gauge-invariant PAC interaction tokenizer. High-band tokens have no raw path:
# token_j = amplitude_j * sum_{i<j} aligned_phase_i.
# `mixer` is unused by arch=triaxial (v1-only, models/build.py:60) but train.py:83
# dereferences it eagerly inside a .get() default -> KeyError without it.
mixer: attention
arch: triaxial
freq_mixer: attention
tokenizer_mode: pac_interaction
pac_token_mode: magnitude
spatial_pe: xyz
band_pe: index
dataset: tuev
data_root: /scratch/zz5070/PACLock/tuh_eeg/v2.0.1/edf
n_channels: 16
seq_len: 1000
sample_rate: 200
sampling_rate: 200
num_classes: 6
n_bands: 8
d_model: 128
depth: 6
dropout: 0.2
kernel_size: 201
patch_len: 200
n_heads: 4
batch_size: 32
num_workers: 8
seed: 0
device: cuda
epochs: 20
eval_every: 1
patience: 20
lr: 0.0001
weight_decay: 0.00001
augmentations: []
wandb_run_name: pacint-tuev-magnitude

