# OURS, new pretext: PAC consistency discrimination (AGENT.md 13.45).
# Motivation: 13.43-J1 decomposed the tokenizer deterministically -- preferred-phase
# alignment +0.0667, magnitude weighting +0.0092 (noise) -- yet the MAE target is
# `log mean A_j`, a pure amplitude scalar. The pretext never supervised the half of
# the token that carries the gain. This objective targets it directly: discriminate a
# token grid built from the TRUE preferred phase from one whose preferred phases are
# permuted across edges. Positives/negatives share a_j, p_i, every |Z| and alpha, and
# the whole multiset of phases -- verified bit-identical amplitude features and an
# identical band-0 root (scratchpad/verify_pac_consistency.py).
# Regressing angle Z directly is impossible in principle here: measured tokens are
# gauge-INVARIANT (13.43-C) while angle Z is gauge-COVARIANT. A binary label is
# invariant, so it is well posed. That constraint is unique to this architecture.
# BLOCKING pre-check for the objective decision (AGENT.md 13.44a consequence 3).
# 13.44a found pretraining REGRESSES on TUEV (best pretrained cell 0.5540 < supervised
# 0.5688). But the pretrain configs use weight_decay 1e-4 while the supervised ones use
# 1e-5 -- a 10x difference that confounds that finding. This cell is pretrain_tuev_pac_
# rand_idx with weight_decay matched to the supervised protocol, nothing else changed.
#   supervised from scratch (index)        0.5493
#   pretrain rand_idx @ wd=1e-4            0.4505
# If this lands near 0.55 the regression was a hyper-parameter artefact and the objective
# grid can proceed; if it stays near 0.45 then pretraining genuinely does not pay on TUEV,
# which is itself the answer and changes how every objective contrast is read.
# TUEV replication of the objective x BandPE 2x2 on the PAC tokenizer (13.44).
# Second dataset for 13.44's two findings; BOTH are answerable inside this
# column alone -- Tier A is cfm_hz vs rand_hz, the BandPE call is cfm_hz vs
# cfm_idx. The raw-token TUEV column is NOT run because it does not exist in
# valid form: 14629684/14651217 predate the 13.31 selection-metric fix and are
# retracted (13.33: 'TUEV has no valid objective result at all').
dataset: tuev
data_root: /scratch/zz5070/PAC-former/tuh_eeg/v2.0.1/edf
n_channels: 16
seq_len: 1000
sample_rate: 200
num_classes: 6
n_bands: 8
d_model: 128
depth: 6
dropout: 0.2
kernel_size: 201
patch_len: 200
batch_size: 32
num_workers: 8
seed: 0
device: cuda
n_heads: 4
sampling_rate: 200
arch: triaxial
freq_mixer: attention
mask_ratio: 0.5
pretrain_epochs: 30
probe_epochs: 20
lr: 0.0001
weight_decay: 0.00001
probe_lr: 0.001
probe_mode: finetune
finetune_lr: 0.0001
spatial_pe: xyz
band_pe: index
tokenizer_mode: pac_interaction
pac_token_mode: measured
pretrain_task: pac_consistency
pac_consistency_negative: scramble
wandb_run_name: pretrain-tuev-pac_consist_scramble
