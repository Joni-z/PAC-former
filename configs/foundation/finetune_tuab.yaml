dataset: tuab
data_root: "${PACFORMER_DATA_ROOT}/tuab/processed"
n_channels: 16
seq_len: 2000
sample_rate: 200
sampling_rate: 200
num_classes: 2

arch: triaxial
freq_mixer: attention
spatial_pe: xyz
band_pe: index
n_bands: 8
d_model: 256
depth: 8
n_heads: 8
dropout: 0.1
kernel_size: 201
patch_len: 200

mask_mode: mixed
mixed_p: 0.5
mask_ratio: 0.5
recon_loss: band_balanced_smooth_l1
init_from: checkpoints/foundation-pacformer-base/mae_state.pt
probe_mode: finetune
probe_epochs: 5
batch_size: 16
num_workers: 8
finetune_lr: 0.00005
finetune_head_lr: 0.0005
finetune_optimizer: adamw
finetune_weight_decay: 0.01
finetune_scheduler: cosine
eval_every_steps: 1500
seed: 0
device: cuda
finetune_output: checkpoints/foundation-pacformer-base/finetuned_tuab.pt
wandb_run_name: foundation-pacformer-base-ft-tuab

